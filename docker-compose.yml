name: middleware-service

services:
  backend:
    build:
      context: ./middleware-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PLATFORM_CONFIG_PATH: /data/platform-config/platform.yaml
      PLATFORM_SESSION_TTL_SECONDS: ${PLATFORM_SESSION_TTL_SECONDS:-90}
      PLATFORM_SESSION_CLEANUP_INTERVAL_SECONDS: ${PLATFORM_SESSION_CLEANUP_INTERVAL_SECONDS:-10}
      PLATFORM_HEARTBEAT_INTERVAL_SECONDS: ${PLATFORM_HEARTBEAT_INTERVAL_SECONDS:-30}
      RABBITMQ_REGISTRY_PLATFORM_CODE: ${RABBITMQ_REGISTRY_PLATFORM_CODE:-registry}
      RABBITMQ_REQUEST_STREAM: ${RABBITMQ_REQUEST_STREAM:-ingestion-requests}
      RABBITMQ_RESULT_STREAM: ${RABBITMQ_RESULT_STREAM:-ingestion-results}
      INGESTION_CACHE_MAX_MESSAGES: ${INGESTION_CACHE_MAX_MESSAGES:-100}
      INGESTION_CACHE_MAX_BYTES: ${INGESTION_CACHE_MAX_BYTES:-4194304}
      REVIEW_CACHE_MAX_MESSAGES: ${REVIEW_CACHE_MAX_MESSAGES:-100}
      REVIEW_CACHE_MAX_BYTES: ${REVIEW_CACHE_MAX_BYTES:-4194304}
      DELETION_CACHE_MAX_MESSAGES: ${DELETION_CACHE_MAX_MESSAGES:-100}
      DELETION_CACHE_MAX_BYTES: ${DELETION_CACHE_MAX_BYTES:-4194304}
      DELETION_REVIEW_CACHE_MAX_MESSAGES: ${DELETION_REVIEW_CACHE_MAX_MESSAGES:-100}
      DELETION_REVIEW_CACHE_MAX_BYTES: ${DELETION_REVIEW_CACHE_MAX_BYTES:-4194304}
      RABBITMQ_DELETION_REQUEST_STREAM: ${RABBITMQ_DELETION_REQUEST_STREAM:-deletion-requests}
      RABBITMQ_DELETION_RESULT_STREAM: ${RABBITMQ_DELETION_RESULT_STREAM:-deletion-results}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5552"
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_USER: ${RABBITMQ_USER:?请配置 .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请配置 .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-files:/workspace/data/ingestion-request/file
      # 兼容升级前已入流的删除附件，仅用于历史下载与 ack 清理。
      - deletion-files:/workspace/data/deletion-request/file
      - type: bind
        source: ./platform.yaml
        target: /data/platform-config/platform.yaml
        read_only: true
        bind:
          create_host_path: false

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    image: middleware-rabbitmq:4.3
    hostname: middleware-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?请配置 .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请配置 .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_REQUEST_STREAM: ${RABBITMQ_REQUEST_STREAM:-ingestion-requests}
      RABBITMQ_RESULT_STREAM: ${RABBITMQ_RESULT_STREAM:-ingestion-results}
      RABBITMQ_DELETION_REQUEST_STREAM: ${RABBITMQ_DELETION_REQUEST_STREAM:-deletion-requests}
      RABBITMQ_DELETION_RESULT_STREAM: ${RABBITMQ_DELETION_RESULT_STREAM:-deletion-results}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  backend-files:
  rabbitmq-data:
  deletion-files:
